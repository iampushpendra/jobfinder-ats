<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}Fortune 500 Job Board{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}Live roles sourced from the job boards of Fortune 500 and top tech companies. Apply directly — no aggregators, no dead listings.{% endblock %}">
    <meta name="keywords" content="{% block meta_keywords %}tech jobs, software engineer jobs, product manager jobs, remote jobs, fortune 500 jobs, startup jobs, greenhouse jobs, lever jobs, ashby jobs{% endblock %}">
    <meta property="og:title" content="{% block og_title %}Fortune 500 Job Board{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Live roles sourced from the job boards of Fortune 500 and top tech companies.{% endblock %}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ request.url }}">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="{{ request.url }}">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Fortune 500 Job Board",
        "url": "{{ request.url_root }}",
        "description": "Live roles sourced from the job boards of Fortune 500 and top tech companies."
    }
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <div class="header-bar">
            <a class="brand" href="/">
                <span class="brand-mark" aria-hidden="true">F5</span>
                <span class="brand-name">Fortune 500 <span>Job Board</span></span>
            </a>
            <nav class="header-actions">
                <a href="/sourcer" class="btn btn-ghost btn-sm">Live Data</a>
                <a href="/blog" class="btn btn-ghost btn-sm">Blog</a>
                <a href="/about" class="btn btn-ghost btn-sm">About</a>
                <button id="emailFavorites" class="btn btn-ghost btn-sm" type="button">Email favorites</button>
                <button id="syncBtn" class="btn btn-solid btn-sm" type="button">Refresh ↻</button>
            </nav>
        </div>
    </header>

    <main class="wrap">
        {% block content %}{% endblock %}
    </main>

    <footer class="wrap site-footer">
        <div class="footer-inner">
            <div class="footer-links">
                <a href="/">Home</a>
                <a href="/sourcer">Live Data</a>
                <a href="/about">About</a>
                <a href="/blog">Blog</a>
                <a href="/robots.txt">robots.txt</a>
                <a href="/sitemap.xml">Sitemap</a>
            </div>
            <span class="footer-source">Sources: Greenhouse · Lever · Ashby</span>
            <span>Last synced <span id="lastSync">{{ stats.last_sync or 'never' }}</span></span>
        </div>
    </footer>

    <script>
    // Scroll reveal
    (function() {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
    })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
