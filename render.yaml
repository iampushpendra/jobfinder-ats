services:
  - type: web
    name: fortune-500-job-board
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT "app:create_app()"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: AUTO_SYNC
        value: "1"
    plan: free
